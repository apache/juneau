<svg xmlns="http://www.w3.org/2000/svg" width="939.6" height="186" viewBox="0 0 939.6 186" role="img" aria-labelledby="title desc">
<title id="title">An agent pane beside a run pane</title>
<desc id="desc">A tmux window split in two: on the left an AI agent waiting for its command, on the right juneau-run&#x27;s live view of that command.</desc>
<rect width="939.6" height="186" rx="6" fill="#1e1e1e"/>
<rect x="423.6" y="12" width="8.4" height="162" fill="#3c3c3c"/>
<g font-family='SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace' font-size="14" xml:space="preserve">
<text y="25.5"><tspan x="12" textLength="42" fill="#d4d4d4" font-weight="bold">Agent</tspan></text>
<text y="61.5"><tspan x="12" textLength="8.4" fill="#11a8cd">&gt;</tspan><tspan x="28.8" textLength="25.2" fill="#d4d4d4">Run</tspan><tspan x="62.4" textLength="25.2" fill="#d4d4d4">the</tspan><tspan x="96" textLength="42" fill="#d4d4d4">build</tspan><tspan x="146.4" textLength="25.2" fill="#d4d4d4">and</tspan><tspan x="180" textLength="33.6" fill="#d4d4d4">tell</tspan><tspan x="222" textLength="16.8" fill="#d4d4d4">me</tspan><tspan x="247.2" textLength="16.8" fill="#d4d4d4">if</tspan><tspan x="272.4" textLength="25.2" fill="#d4d4d4">the</tspan><tspan x="306" textLength="42" fill="#d4d4d4">tests</tspan><tspan x="356.4" textLength="42" fill="#d4d4d4">pass.</tspan></text>
<text y="97.5"><tspan x="12" textLength="33.6" fill="#d4d4d4" fill-opacity="0.6">I&#x27;ll</tspan><tspan x="54" textLength="42" fill="#d4d4d4" fill-opacity="0.6">start</tspan><tspan x="104.4" textLength="16.8" fill="#d4d4d4" fill-opacity="0.6">it</tspan><tspan x="129.6" textLength="16.8" fill="#d4d4d4" fill-opacity="0.6">in</tspan><tspan x="154.8" textLength="8.4" fill="#d4d4d4" fill-opacity="0.6">a</tspan><tspan x="171.6" textLength="33.6" fill="#d4d4d4" fill-opacity="0.6">side</tspan><tspan x="213.6" textLength="33.6" fill="#d4d4d4" fill-opacity="0.6">pane</tspan><tspan x="255.6" textLength="16.8" fill="#d4d4d4" fill-opacity="0.6">so</tspan><tspan x="280.8" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">you</tspan><tspan x="314.4" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">can</tspan><tspan x="348" textLength="42" fill="#d4d4d4" fill-opacity="0.6">watch</tspan><tspan x="398.4" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">it.</tspan></text>
<text y="133.5"><tspan x="12" textLength="8.4" fill="#0dbc79">*</tspan><tspan x="28.8" textLength="75.6" fill="#d4d4d4">Bash(tmux</tspan><tspan x="112.8" textLength="100.8" fill="#d4d4d4">split-window</tspan><tspan x="222" textLength="16.8" fill="#d4d4d4">-h</tspan><tspan x="247.2" textLength="16.8" fill="#d4d4d4">-d</tspan><tspan x="272.4" textLength="33.6" fill="#d4d4d4">...)</tspan></text>
<text y="151.5"><tspan x="12" textLength="8.4" fill="#0dbc79">*</tspan><tspan x="28.8" textLength="75.6" fill="#d4d4d4">Bash(tmux</tspan><tspan x="112.8" textLength="67.2" fill="#d4d4d4">wait-for</tspan><tspan x="188.4" textLength="92.4" fill="#d4d4d4">build-done)</tspan></text>
<text y="169.5"><tspan x="28.8" textLength="58.8" fill="#d4d4d4" fill-opacity="0.6">waiting</tspan><tspan x="96" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">for</tspan><tspan x="129.6" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">the</tspan><tspan x="163.2" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">run</tspan><tspan x="196.8" textLength="16.8" fill="#d4d4d4" fill-opacity="0.6">to</tspan><tspan x="222" textLength="75.6" fill="#d4d4d4" fill-opacity="0.6">finish...</tspan></text>
<text y="25.5"><tspan x="432" textLength="8.4" fill="#11a8cd">▶</tspan><tspan x="448.8" textLength="25.2" fill="#d4d4d4">mvn</tspan><tspan x="482.4" textLength="50.4" fill="#d4d4d4">verify</tspan></text>
<text y="43.5"><tspan x="432" textLength="8.4" fill="#d4d4d4" fill-opacity="0.6">▶</tspan><tspan x="448.8" textLength="58.8" fill="#d4d4d4">Output:</tspan><tspan x="516" textLength="33.6" fill="#d4d4d4">tail</tspan><tspan x="558" textLength="16.8" fill="#d4d4d4">-f</tspan><tspan x="583.2" textLength="58.8" fill="#d4d4d4">run.log</tspan></text>
<text y="61.5"><tspan x="432" textLength="8.4" fill="#d4d4d4" fill-opacity="0.6">▶</tspan><tspan x="448.8" textLength="50.4" fill="#d4d4d4">Board:</tspan><tspan x="507.6" textLength="33.6" fill="#d4d4d4">tail</tspan><tspan x="549.6" textLength="16.8" fill="#d4d4d4">-f</tspan><tspan x="574.8" textLength="109.2" fill="#d4d4d4">run.board.log</tspan></text>
<text y="79.5"><tspan x="432" textLength="8.4" fill="#11a8cd">⠋</tspan><tspan x="448.8" textLength="25.2" fill="#d4d4d4">mvn</tspan><tspan x="482.4" textLength="50.4" fill="#d4d4d4">verify</tspan><tspan x="549.6" textLength="8.4" fill="#0dbc79">█</tspan><tspan x="558" textLength="8.4" fill="#11a8cd">█</tspan><tspan x="566.4" textLength="8.4" fill="#d4d4d4">░</tspan><tspan x="591.6" textLength="25.2" fill="#d4d4d4">1/3</tspan><tspan x="633.6" textLength="8.4" fill="#d4d4d4">2</tspan><tspan x="650.4" textLength="42" fill="#d4d4d4">tests</tspan><tspan x="894" textLength="33.6" fill="#d4d4d4">0:03</tspan></text>
<text y="97.5"><tspan x="465.6" textLength="33.6" fill="#d4d4d4">Demo</tspan><tspan x="507.6" textLength="50.4" fill="#d4d4d4">Module</tspan><tspan x="566.4" textLength="8.4" fill="#d4d4d4">B</tspan><tspan x="894" textLength="33.6" fill="#d4d4d4">0:03</tspan></text>
</g>
