<text y="79.5"><tspan x="12" textLength="8.4" fill="#11a8cd">⠋</tspan><tspan x="28.8" textLength="25.2" fill="#d4d4d4">mvn</tspan><tspan x="62.4" textLength="50.4" fill="#d4d4d4">verify</tspan><tspan x="129.6" textLength="8.4" fill="#0dbc79">█</tspan><tspan x="138" textLength="8.4" fill="#11a8cd">█</tspan><tspan x="146.4" textLength="8.4" fill="#d4d4d4">░</tspan><tspan x="171.6" textLength="25.2" fill="#d4d4d4">1/3</tspan><tspan x="213.6" textLength="8.4" fill="#d4d4d4">2</tspan><tspan x="230.4" textLength="42" fill="#d4d4d4">tests</tspan><tspan x="810" textLength="33.6" fill="#d4d4d4">0:03</tspan></text>
