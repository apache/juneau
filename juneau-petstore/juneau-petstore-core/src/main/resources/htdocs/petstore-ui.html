<!--
  No-build single-page React demo for the Juneau petstore.

  Demonstrates the "Juneau as a headless JSON backend + decoupled client-side SPA frontend" pattern
  alongside the built-in server-rendered HTML-doc UI.

  React and ReactDOM 18.3.1 (MIT) are vendored under vendor/ and served from the classpath by the same
  static-files mount as this page, so the demo works with no network access.  The app uses plain
  React.createElement calls (no JSX), so no in-browser compiler or Node/npm build step is needed.
  See vendor/README.txt for provenance.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Juneau Petstore — React UI</title>
	<style>
		body { font-family: system-ui, -apple-system, sans-serif; padding: 2em; max-width: 60em; margin: 0 auto; }
		h1 { border-bottom: 1px solid #ccc; padding-bottom: 0.3em; }
		table { border-collapse: collapse; width: 100%; }
		th, td { text-align: left; padding: 0.4em 0.8em; border-bottom: 1px solid #eee; }
		th { background: #f4f4f4; }
		.error { color: #b00; padding: 0.5em; background: #fee; border: 1px solid #fcc; border-radius: 3px; }
		.muted { color: #666; }
	</style>
</head>
<body>
	<div id="root"></div>

	<script src="/petstore-ui/static/vendor/react.production.min.js"></script>
	<script src="/petstore-ui/static/vendor/react-dom.production.min.js"></script>

	<script>
		const h = React.createElement;
		const { useState, useEffect } = React;

		function PetTable({ pets }) {
			if (!pets.length) return h('p', { className: 'muted' }, 'No pets.');
			return h('table', null,
				h('thead', null,
					h('tr', null,
						h('th', null, 'ID'), h('th', null, 'Name'), h('th', null, 'Species'), h('th', null, 'Price'), h('th', null, 'Status'))),
				h('tbody', null,
					pets.map(p =>
						h('tr', { key: p.id },
							h('td', null, p.id),
							h('td', null, p.name),
							h('td', null, p.species),
							h('td', null, p.price?.toFixed?.(2) ?? p.price),
							h('td', null, p.status)))));
		}

		function App() {
			const [pets, setPets] = useState([]);
			const [err, setErr] = useState(null);
			const [loading, setLoading] = useState(true);

			useEffect(() => {
				fetch('/petstore/pets', { headers: { 'Accept': 'application/json' } })
					.then(r => {
						if (!r.ok) throw new Error('HTTP ' + r.status);
						return r.json();
					})
					.then(data => { setPets(data); setLoading(false); })
					.catch(e => { setErr(String(e)); setLoading(false); });
			}, []);

			return h('div', null,
				h('h1', null, 'Juneau Petstore — React UI'),
				h('p', { className: 'muted' }, 'Headless Juneau backend at ', h('code', null, '/petstore/*'), ', rendered by a no-build React SPA.'),
				loading && h('p', null, 'Loading…'),
				err && h('div', { className: 'error' }, 'Failed to load pets: ', err),
				!loading && !err && h(PetTable, { pets }));
		}

		ReactDOM.createRoot(document.getElementById('root')).render(h(App));
	</script>
</body>
</html>
