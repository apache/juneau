<svg xmlns="http://www.w3.org/2000/svg" width="855.6" height="114" viewBox="0 0 855.6 114" role="img" aria-labelledby="title desc">
<title id="title">The board console view of a finished Maven run</title>
<desc id="desc">juneau-terminal&#x27;s board view after the build: one row with the full progress bar and the test count, and the final line.</desc>
<rect width="855.6" height="114" rx="6" fill="#1e1e1e"/>
<g font-family='SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace' font-size="14" xml:space="preserve">
<text y="25.5"><tspan x="12" textLength="8.4" fill="#11a8cd">▶</tspan><tspan x="28.8" textLength="25.2" fill="#d4d4d4">mvn</tspan><tspan x="62.4" textLength="50.4" fill="#d4d4d4">verify</tspan></text>
<text y="43.5"><tspan x="12" textLength="8.4" fill="#d4d4d4" fill-opacity="0.6">▶</tspan><tspan x="28.8" textLength="58.8" fill="#d4d4d4">Output:</tspan><tspan x="96" textLength="33.6" fill="#d4d4d4">tail</tspan><tspan x="138" textLength="16.8" fill="#d4d4d4">-f</tspan><tspan x="163.2" textLength="58.8" fill="#d4d4d4">run.log</tspan></text>
<text y="61.5"><tspan x="12" textLength="8.4" fill="#d4d4d4" fill-opacity="0.6">▶</tspan><tspan x="28.8" textLength="50.4" fill="#d4d4d4">Board:</tspan><tspan x="87.6" textLength="33.6" fill="#d4d4d4">tail</tspan><tspan x="129.6" textLength="16.8" fill="#d4d4d4">-f</tspan><tspan x="154.8" textLength="109.2" fill="#d4d4d4">run.board.log</tspan></text>
<text y="79.5"><tspan x="12" textLength="8.4" fill="#0dbc79">●</tspan><tspan x="28.8" textLength="25.2" fill="#d4d4d4">mvn</tspan><tspan x="62.4" textLength="50.4" fill="#d4d4d4">verify</tspan><tspan x="129.6" textLength="25.2" fill="#0dbc79">███</tspan><tspan x="171.6" textLength="25.2" fill="#d4d4d4">3/3</tspan><tspan x="213.6" textLength="8.4" fill="#d4d4d4">6</tspan><tspan x="230.4" textLength="42" fill="#d4d4d4">tests</tspan><tspan x="810" textLength="33.6" fill="#d4d4d4">0:07</tspan></text>
<text y="97.5"><tspan x="12" textLength="8.4" fill="#11a8cd">▶</tspan><tspan x="28.8" textLength="58.8" fill="#d4d4d4">Overall</tspan><tspan x="104.4" textLength="16.8" fill="#d4d4d4">✅</tspan><tspan x="129.6" textLength="33.6" fill="#d4d4d4">Done</tspan><tspan x="171.6" textLength="16.8" fill="#d4d4d4">in</tspan><tspan x="196.8" textLength="33.6" fill="#d4d4d4">0:07</tspan></text>
</g>
</svg>
