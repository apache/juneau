<svg xmlns="http://www.w3.org/2000/svg" width="922.8" height="222" viewBox="0 0 922.8 222" role="img" aria-labelledby="title desc">
<title id="title">An agent pane beside a leader pane and a follower pane</title>
<desc id="desc">A tmux window split in two: on the left an AI agent waiting for its command; on the right, above, juneau-terminal&#x27;s live view of that command (the leader pane) and, below it, the raw Maven output from tail -F on the full log (the follower pane).</desc>
<rect width="922.8" height="222" rx="6" fill="#1e1e1e"/>
<rect x="406.8" y="12" width="8.4" height="198" fill="#3c3c3c"/>
<rect x="415.2" y="102" width="495.6" height="18" fill="#3c3c3c"/>
<g font-family='SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace' font-size="14" xml:space="preserve">
<text y="25.5"><tspan x="12" textLength="42" fill="#d4d4d4" font-weight="bold">Agent</tspan></text>
<text y="61.5"><tspan x="12" textLength="8.4" fill="#11a8cd">&gt;</tspan><tspan x="28.8" textLength="25.2" fill="#d4d4d4">Run</tspan><tspan x="62.4" textLength="25.2" fill="#d4d4d4">the</tspan><tspan x="96" textLength="42" fill="#d4d4d4">build</tspan><tspan x="146.4" textLength="25.2" fill="#d4d4d4">and</tspan><tspan x="180" textLength="33.6" fill="#d4d4d4">tell</tspan><tspan x="222" textLength="16.8" fill="#d4d4d4">me</tspan><tspan x="247.2" textLength="16.8" fill="#d4d4d4">if</tspan><tspan x="272.4" textLength="25.2" fill="#d4d4d4">the</tspan><tspan x="306" textLength="42" fill="#d4d4d4">tests</tspan><tspan x="356.4" textLength="42" fill="#d4d4d4">pass.</tspan></text>
<text y="97.5"><tspan x="12" textLength="33.6" fill="#d4d4d4" fill-opacity="0.6">I&#x27;ll</tspan><tspan x="54" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">run</tspan><tspan x="87.6" textLength="16.8" fill="#d4d4d4" fill-opacity="0.6">it</tspan><tspan x="112.8" textLength="16.8" fill="#d4d4d4" fill-opacity="0.6">in</tspan><tspan x="138" textLength="8.4" fill="#d4d4d4" fill-opacity="0.6">a</tspan><tspan x="154.8" textLength="33.6" fill="#d4d4d4" fill-opacity="0.6">side</tspan><tspan x="196.8" textLength="33.6" fill="#d4d4d4" fill-opacity="0.6">pane</tspan><tspan x="238.8" textLength="16.8" fill="#d4d4d4" fill-opacity="0.6">so</tspan><tspan x="264" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">you</tspan><tspan x="297.6" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">can</tspan><tspan x="331.2" textLength="42" fill="#d4d4d4" fill-opacity="0.6">watch</tspan><tspan x="381.6" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">it.</tspan></text>
<text y="133.5"><tspan x="12" textLength="8.4" fill="#0dbc79">*</tspan><tspan x="28.8" textLength="84" fill="#d4d4d4">Bash(&quot;$wr&quot;</tspan><tspan x="121.2" textLength="16.8" fill="#d4d4d4">-t</tspan><tspan x="146.4" textLength="42" fill="#d4d4d4">build</tspan><tspan x="196.8" textLength="16.8" fill="#d4d4d4">--</tspan><tspan x="222" textLength="25.2" fill="#d4d4d4">mvn</tspan><tspan x="255.6" textLength="58.8" fill="#d4d4d4">verify)</tspan></text>
<text y="151.5"><tspan x="28.8" textLength="58.8" fill="#d4d4d4" fill-opacity="0.6">waiting</tspan><tspan x="96" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">for</tspan><tspan x="129.6" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">the</tspan><tspan x="163.2" textLength="25.2" fill="#d4d4d4" fill-opacity="0.6">run</tspan><tspan x="196.8" textLength="16.8" fill="#d4d4d4" fill-opacity="0.6">to</tspan><tspan x="222" textLength="75.6" fill="#d4d4d4" fill-opacity="0.6">finish...</tspan></text>
<text y="25.5"><tspan x="415.2" textLength="8.4" fill="#11a8cd">▶</tspan><tspan x="432" textLength="25.2" fill="#d4d4d4">mvn</tspan><tspan x="465.6" textLength="50.4" fill="#d4d4d4">verify</tspan></text>
<text y="43.5"><tspan x="415.2" textLength="8.4" fill="#d4d4d4" fill-opacity="0.6">▶</tspan><tspan x="432" textLength="58.8" fill="#d4d4d4">Output:</tspan><tspan x="499.2" textLength="33.6" fill="#d4d4d4">tail</tspan><tspan x="541.2" textLength="16.8" fill="#d4d4d4">-f</tspan><tspan x="566.4" textLength="58.8" fill="#d4d4d4">run.log</tspan></text>
<text y="61.5"><tspan x="415.2" textLength="8.4" fill="#d4d4d4" fill-opacity="0.6">▶</tspan><tspan x="432" textLength="50.4" fill="#d4d4d4">Board:</tspan><tspan x="490.8" textLength="33.6" fill="#d4d4d4">tail</tspan><tspan x="532.8" textLength="16.8" fill="#d4d4d4">-f</tspan><tspan x="558" textLength="109.2" fill="#d4d4d4">run.board.log</tspan></text>
<text y="79.5"><tspan x="415.2" textLength="8.4" fill="#11a8cd">⠋</tspan><tspan x="432" textLength="25.2" fill="#d4d4d4">mvn</tspan><tspan x="465.6" textLength="50.4" fill="#d4d4d4">verify</tspan><tspan x="532.8" textLength="8.4" fill="#0dbc79">█</tspan><tspan x="541.2" textLength="8.4" fill="#11a8cd">█</tspan><tspan x="549.6" textLength="8.4" fill="#d4d4d4">░</tspan><tspan x="574.8" textLength="25.2" fill="#d4d4d4">1/3</tspan><tspan x="616.8" textLength="8.4" fill="#d4d4d4">2</tspan><tspan x="633.6" textLength="42" fill="#d4d4d4">tests</tspan><tspan x="877.2" textLength="33.6" fill="#d4d4d4">0:03</tspan></text>
<text y="97.5"><tspan x="448.8" textLength="33.6" fill="#d4d4d4">Demo</tspan><tspan x="490.8" textLength="50.4" fill="#d4d4d4">Module</tspan><tspan x="549.6" textLength="8.4" fill="#d4d4d4">B</tspan><tspan x="877.2" textLength="33.6" fill="#d4d4d4">0:03</tspan></text>
<text y="133.5"><tspan x="415.2" textLength="50.4" fill="#d4d4d4">[INFO]</tspan></text>
<text y="151.5"><tspan x="415.2" textLength="50.4" fill="#d4d4d4">[INFO]</tspan><tspan x="474" textLength="67.2" fill="#d4d4d4">Results:</tspan></text>
<text y="169.5"><tspan x="415.2" textLength="50.4" fill="#d4d4d4">[INFO]</tspan></text>
<text y="187.5"><tspan x="415.2" textLength="75.6" fill="#d4d4d4">[WARNING]</tspan><tspan x="499.2" textLength="42" fill="#d4d4d4">Tests</tspan><tspan x="549.6" textLength="33.6" fill="#d4d4d4">run:</tspan><tspan x="591.6" textLength="16.8" fill="#d4d4d4">3,</tspan><tspan x="616.8" textLength="75.6" fill="#d4d4d4">Failures:</tspan><tspan x="700.8" textLength="16.8" fill="#d4d4d4">0,</tspan><tspan x="726" textLength="58.8" fill="#d4d4d4">Errors:</tspan><tspan x="793.2" textLength="16.8" fill="#d4d4d4">0,</tspan><tspan x="818.4" textLength="67.2" fill="#d4d4d4">Skipped:</tspan><tspan x="894" textLength="8.4" fill="#d4d4d4">1</tspan></text>
