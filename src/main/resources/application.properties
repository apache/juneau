server.address=127.0.0.1
server.port=8790
spring.application.name=juneau-release-manager
rm.repo.dir=${user.home}/git/apache/juneau
rm.repo.slug=apache/juneau
rm.state.dir=${user.home}/.juneau-release-manager/state
rm.staging.dir=${user.home}/.juneau-release-manager/staging
rm.git.committer.email=jamesbognar@apache.org
rm.slack.webhook=
# Execution mode: safe (default) simulates all mutations + routes Nexus to the in-app loopback mock;
# live executes real mutations (and still requires per-run arming at the guard chokepoint).
rm.mode=safe
