server.address=127.0.0.1
server.port=8790
spring.application.name=juneau-release-manager
rm.repo.dir=${user.home}/git/apache/juneau
rm.repo.slug=apache/juneau
rm.state.dir=${user.home}/.juneau-release-manager/state
rm.staging.dir=${user.home}/.juneau-release-manager/staging
rm.git.committer.email=jamesbognar@apache.org
rm.slack.webhook=
# Execution mode: safe (default) simulates all mutations + routes Nexus to the in-app loopback mock;
# live executes real mutations (and still requires per-run arming at the guard chokepoint).
#
# safe being the default is an OPERATIONAL SAFETY default, not a security control. It exists so that starting the
# app, exploring it, or running it in a test cannot mutate anything public by accident.
#
# It is worth recording that until the loopback write boundary landed (see AppConfiguration), this default was in
# fact doing real security work, and was the only thing standing between a hostile page in the operator's browser
# and a published release: that page could derive the "<version> LIVE" confirm phrase from the app's own page, POST
# it to /arm cross-origin, and trigger a mutating step. Nothing rejected the request; the box simply had to have
# been started in live mode.
#
# That is exactly why it was never adequate as a security control. Its protection evaporates the moment someone
# starts the app with rm.mode=live -- which is to say, during an actual release, when the consequences of a forged
# request are at their worst. A control that is present only when it does not matter is not a control. The
# boundary is what closes that gap, and it applies in both modes.
rm.mode=safe
